[package]
name = "bastian"
version = "0.1.0"
edition = "2024"
description = "A terminal Markdown reader"
license = "MIT"
repository = "https://github.com/mainframev/bastian"
readme = "README.md"
keywords = ["markdown", "terminal", "tui", "reader", "cli"]
categories = ["command-line-utilities"]
# README images and repo tooling, not needed to build the crate.
exclude = ["assets/", "demo/", ".github/", ".githooks/", "justfile", "cliff.toml"]

# Prebuilt archives from the release workflow, for `cargo binstall bastian`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
# Same version ratatui uses; use-dev-tty reads keys from /dev/tty so `bastian -` works with piped stdin.
crossterm = { version = "0.29", default-features = false, features = ["use-dev-tty", "osc52"] }
hyperrat = "0.1"
ignore = "0.4.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
jiff = "0.2.38"
libc = "0.2.190"
markdown = "1"
nucleo-matcher = "0.3.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = "5.3.0"
toml = "1.1.8"
tui-big-text = "0.8.10"
tui-input = "0.15"
tui-scrollbar = "0.2"
tui-tree-widget = "0.24"
unicode-width = "0.2.2"
# No gzip: ureq applies body limits before decoding, so a small gzipped
# response could inflate far past them.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Too noisy for a TUI binary, or a matter of taste.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
# Settings structs are flags by nature.
struct_excessive_bools = "allow"
# Terminal geometry is u16 cells against usize indexes everywhere.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# `push_str(&format!(..))` reads better than `let _ = write!(..)` into a
# String, which can't fail anyway.
format_push_string = "allow"
format_collect = "allow"
# Cheap extras beyond pedantic.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
