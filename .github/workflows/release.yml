name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # No Windows: bastian reads keys from /dev/tty and uses libc.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          NAME="bastian-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/bastian" README.md LICENSE "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: bastian-${{ matrix.target }}
          path: bastian-*.tar.gz

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, publish-crates]
    permissions:
      contents: write
      # git-cliff reads PR numbers and authors for the notes.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        env:
          # git-cliff fetches PR numbers and authors from the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git cliff --latest --strip header > RELEASE_NOTES.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- *.tar.gz > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          prerelease: ${{ contains(github.ref_name, '-') }}

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: release
    # Pre-releases stay out of the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate formula
        run: |
          (cd artifacts && sha256sum -- *.tar.gz > SHA256SUMS)
          .github/scripts/homebrew-formula.sh "${GITHUB_REF_NAME#v}" artifacts/SHA256SUMS > bastian.rb

      - uses: actions/checkout@v7
        with:
          repository: mainframev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Push formula
        working-directory: tap
        run: |
          mkdir -p Formula
          mv ../bastian.rb Formula/bastian.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bastian.rb
          git commit -m "bastian ${GITHUB_REF_NAME#v}"
          git push
