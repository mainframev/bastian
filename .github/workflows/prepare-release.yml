name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (leave as "auto" to detect it from the commits)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Get current version
        id: current
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Detect bump from commits
        id: detect
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            # First release: ship the version already in Cargo.toml.
            DETECTED="none"
          elif git log "$LATEST_TAG..HEAD" --pretty=format:"%s%n%b" | grep -qE "(^[a-z]+(\(.*\))?!:|BREAKING CHANGE)"; then
            DETECTED="major"
          elif git log "$LATEST_TAG..HEAD" --pretty=format:"%s" | grep -qE "^feat(\(.*\))?:"; then
            DETECTED="minor"
          else
            DETECTED="patch"
          fi
          echo "Detected bump: $DETECTED (since ${LATEST_TAG:-the first commit})"
          echo "detected=$DETECTED" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: new
        run: |
          BUMP="${{ inputs.bump }}"
          if [ "$BUMP" = "auto" ]; then
            BUMP="${{ steps.detect.outputs.detected }}"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.current.outputs.version }}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            none) ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          if git rev-parse -q --verify "refs/tags/v$NEW_VERSION" >/dev/null; then
            echo "::error::Tag v$NEW_VERSION already exists"
            exit 1
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION ($BUMP)"

      - name: Update version and changelog
        env:
          # git-cliff fetches PR numbers and authors from the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -b "release/v${{ steps.new.outputs.version }}"
          sed -i '0,/^version = ".*"/s//version = "${{ steps.new.outputs.version }}"/' Cargo.toml
          # Keep Cargo.lock's own entry in step (release builds use --locked).
          sed -i '/^name = "bastian"$/{n;s/^version = ".*"/version = "${{ steps.new.outputs.version }}"/;}' Cargo.lock
          git cliff --tag "v${{ steps.new.outputs.version }}" -o CHANGELOG.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore: prepare release ${{ steps.new.outputs.version }}"
          git push origin "release/v${{ steps.new.outputs.version }}"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.bump }}" = "auto" ]; then
            BUMP_INFO="auto-detected as **${{ steps.new.outputs.bump }}** from the commit history"
          else
            BUMP_INFO="set manually to **${{ steps.new.outputs.bump }}**"
          fi

          gh pr create \
            --base main \
            --head "release/v${{ steps.new.outputs.version }}" \
            --title "chore: release v${{ steps.new.outputs.version }}" \
            --body "$(cat <<BODY
          ## Release v${{ steps.new.outputs.version }}

          Created by the **Prepare Release** workflow.

          - Version: \`${{ steps.current.outputs.version }}\` → \`${{ steps.new.outputs.version }}\`
          - Bump: $BUMP_INFO
          - Updated CHANGELOG.md

          Merging this PR tags \`v${{ steps.new.outputs.version }}\`, which builds the binaries,
          publishes to crates.io and creates the GitHub release.

          ---
          *Triggered by @${{ github.actor }}*
          BODY
          )"
