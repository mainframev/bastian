appearance = "light"

[ui]
text = "#657b83"
muted = "#93a1a1"
subtle = "#839496"
surface = "#eee8d5"
accent = "#268bd2"
h1_fg = "#fdf6e3"
h1_bg = "#268bd2"
heading = "#cb4b16"
heading_3 = "#b58900"
heading_4 = "#859900"
