name: CI

# Not run on pull requests or pushes, to save Actions minutes: Release calls
# it before building, and it can be started by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Clippy (mermaid)
        run: cargo clippy --all-targets --features mermaid -- -D warnings
      - name: Test (mermaid)
        run: cargo test --features mermaid

  size:
    name: Binary size
    # The budget is for this platform; sizes differ elsewhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked
      - name: Check size budget
        run: .github/scripts/size-check.sh target/release/bastian .github/size-budget
