name: Create Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  create-tag:
    name: Create Release Tag
    # Only merged PRs from a release branch.
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A tag pushed with GITHUB_TOKEN doesn't trigger other workflows, so push
      # it with a PAT to start the release. Check out the merge commit itself,
      # not whatever main points at by now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Create and push tag
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release $VERSION"
          git push origin "v$VERSION"

      - name: Delete release branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push origin --delete "$BRANCH" || echo "Branch already deleted"
