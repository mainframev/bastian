[package]
name = "bastian"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
# Same version ratatui uses; use-dev-tty reads keys from /dev/tty so `bastian -` works with piped stdin.
crossterm = { version = "0.29", default-features = false, features = ["use-dev-tty", "osc52"] }
ignore = "0.4.33"
jiff = "0.2.38"
libc = "0.2.190"
markdown = "1"
nucleo-matcher = "0.3.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = "5.3.0"
toml = "1.1.8"
tui-big-text = "0.8.10"
unicode-width = "0.2.2"
ureq = "3.4.2"
url = "2.5.8"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
