# Catppuccin Macchiato
# Source: https://github.com/catppuccin/palette/blob/main/palette.json, https://github.com/catppuccin/catppuccin/blob/main/docs/style-guide.md, https://github.com/catppuccin/nvim/blob/main/lua/catppuccin/groups/treesitter.lua
appearance = "dark"

[ui]
text = "#cad3f5"
muted = "#8087a2"
subtle = "#a5adcb"
surface = "#363a4f"
accent = "#c6a0f6"
