[package]
name = "bastian"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Same version ratatui uses; use-dev-tty reads keys from /dev/tty so `bastian -` works with piped stdin.
crossterm = { version = "0.29", default-features = false, features = ["use-dev-tty"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
syntect = "5.3.0"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.49.0"
